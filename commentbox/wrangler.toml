# Generated by the CommentBox CLI (init). Docs: https://commentbox.dev/#self-host
name = "commentbox"
main = "src/index.js"
compatibility_date = "2024-10-01"

[vars]
ALLOWED_ORIGINS = "http://localhost:3000"
PROJECT_NAME = "commentbox-demo"
WIDGET_ENABLED = "true"
RATE_LIMIT_PER_HOUR = "20"
WEBHOOK_URL = "http://localhost:8790/hooks/commentbox"
WEBHOOK_MAX_ATTEMPTS = "6"
WEBHOOK_INTEGRATION = "webhook"
# Opt-in anonymous install count (off by default). See https://commentbox.dev telemetry docs.
COMMENTBOX_TELEMETRY = "0"
PUBLIC_URL = ""

[[d1_databases]]
binding = "DB"
database_name = "commentbox"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[[rules]]
type = "Text"
globs = ["**/*.global.js"]
fallthrough = true
